spring.application.name=discovery-server
server.port=8761

# Este servidor NO se registra en si mismo ni descarga el registro (en produccion se montan varios Eureka que se replican entre si)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# --- Ajustes pensados para DESARROLLO (cambios visibles en segundos) ---
# Proteccion de autopreservacion: si caen muchos servicios a la vez Eureka asume un problema de red y NO los expulsa. Util en produccion,
# confuso en desarrollo, donde apagas servicios a proposito.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.response-cache-update-interval-ms=3000

management.endpoints.web.exposure.include=health,info
