spring.application.name=order-service
server.port=${PORT:8082}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5
# El servicio se registra antes de estar completamente listo (estado DOWN) y Eureka solo replica el cambio a UP cada 30 s por defecto
# (40 s la primera vez): con 5 s el servicio queda disponible poco despues de arrancar
eureka.client.instance-info-replication-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.healthcheck.enabled=true

# El balanceador guarda en cache las copias de cada servicio; con 5 s se enteran rapido de las que entran o salen (por defecto 35 s)
spring.cloud.loadbalancer.cache.ttl=5s

management.endpoints.web.exposure.include=health,info
