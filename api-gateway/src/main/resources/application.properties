spring.application.name=api-gateway
server.port=${PORT:8080}

# --- Registro en Eureka (el gateway tambien es un cliente: lo usa para encontrar los servicios) ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5
# El servicio se registra antes de estar completamente listo (estado DOWN) y Eureka solo replica el cambio a UP cada 30 s por defecto
# (40 s la primera vez): con 5 s el servicio queda disponible poco despues de arrancar
eureka.client.instance-info-replication-interval-seconds=5
eureka.client.initial-instance-info-replication-interval-seconds=5

# Cache del balanceador: con 5 s se entera rapido de las copias que entran o salen (por defecto 35 s)
spring.cloud.loadbalancer.cache.ttl=5s

# Tiempo maximo de espera de la respuesta de un servicio: si lo supera, el gateway responde 504
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000

# --- Reglas del gateway ---
# Claves validas para POST/PUT/PATCH/DELETE (cambialas y no las subas al repositorio; en un sistema real vienen de un gestor de secretos)
gateway.api-keys=demo-key-123,otra-clave-456
gateway.rate-limit-per-minute=120
gateway.allowed-origins=http://localhost:*,http://127.0.0.1:*
gateway.retries=2

management.endpoints.web.exposure.include=health,info,gateway
# Spring Boot 4: el acceso a cada endpoint se declara con "access". Solo lectura: se pueden VER las rutas pero no modificarlas en caliente
management.endpoint.gateway.access=read-only
